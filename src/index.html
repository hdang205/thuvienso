<!doctype html>
<html lang="vi">
  <head>

    <title>Thư viện số FBU</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

      <nav>
        <a href="#books">Sách</a>
        <a href="#users">Người dùng</a>
        <a href="#loans">Mượn trả</a>
      </nav>
    </header>

    <main>
      <section id="books">
        <h2>Quản lý sách</h2>
        <div id="books-list"></div>
        <button id="add-book-btn">Thêm sách</button>
      </section>

      <section id="users">
        <h2>Quản lý người dùng</h2>
        <div id="users-list"></div>
      </section>

      <section id="loans">
        <h2>Mượn trả sách</h2>
        <div id="loans-list"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
